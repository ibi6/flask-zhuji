[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hostguard-agent"
version = "0.1.0"
description = "Cross-platform telemetry agent for HostGuard"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "psutil>=5.9,<8",
]

[project.optional-dependencies]
dev = [
  "jsonschema>=4.20,<5",
  "mypy>=1.10,<2",
  "pytest>=8,<9",
  "ruff>=0.6,<1",
  "types-psutil>=5.9",
]

[project.scripts]
hostguard-agent = "hostguard_agent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hostguard_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S104", "S106"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["hostguard_agent"]

