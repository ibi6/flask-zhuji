[project]
name = "hostguard-backend"
version = "0.1.0"
description = "HostGuard Flask API"
requires-python = ">=3.11"
dependencies = [
  "argon2-cffi>=23.1,<26",
  "cryptography>=43,<50",
  "email-validator>=2.2,<3",
  "Flask>=3.1,<4",
  "Flask-Limiter>=3.12,<5",
  "Flask-Migrate>=4.1,<5",
  "Flask-SQLAlchemy>=3.1,<4",
  "pydantic>=2.11,<3",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.16,<2",
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<8",
  "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hostguard"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
pythonpath = ["."]

[tool.flask]
app = "hostguard:create_app"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

